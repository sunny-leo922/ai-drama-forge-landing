<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Forge — 授权管理</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a1f29;
    --surface-2: #232a36;
    --border: #2d3548;
    --ink: #e6e9ef;
    --ink-muted: #8b95a7;
    --brand: #d4a574;
    --brand-soft: rgba(212, 165, 116, 0.12);
    --ok: #5fbf8a;
    --warn: #e8b85f;
    --err: #e87c7c;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 .badge {
    font-size: 11px;
    font-weight: 500;
    background: var(--brand-soft);
    color: var(--brand);
    padding: 3px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .logout {
    font-size: 13px;
    color: var(--ink-muted);
    background: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }
  .logout:hover {
    border-color: var(--brand);
    color: var(--ink);
  }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .stat .label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .stat .value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .stat .value.ok { color: var(--ok); }
  .stat .value.warn { color: var(--warn); }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--ink);
  }

  /* Form */
  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }
  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
  }
  button.primary {
    background: var(--brand);
    color: var(--bg);
    border: none;
    padding: 9px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.9; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-muted);
    padding: 4px 10px;
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    transition: all 0.15s;
  }
  button.ghost:hover { border-color: var(--err); color: var(--err); }
  button.ghost.copy:hover { border-color: var(--brand); color: var(--brand); }
  button.ghost.del:hover { border-color: var(--err); color: var(--err); }
  button.ghost.copied { border-color: var(--ok); color: var(--ok); }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    background: var(--surface-2);
  }
  th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--brand);
    font-size: 12px;
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .status {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .status.active { background: rgba(95,191,138,0.15); color: var(--ok); }
  .status.revoked { background: rgba(232,124,124,0.15); color: var(--err); }
  .status.expired { background: rgba(232,184,95,0.15); color: var(--warn); }
  .ts { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }
  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .modal .codes {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    margin-bottom: 16px;
    max-height: 300px;
    overflow-y: auto;
  }
  .modal .codes div {
    padding: 4px 0;
    color: var(--brand);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .modal .codes div .code-text {
    flex: 1;
    word-break: break-all;
  }
  .modal .codes div .copy-one {
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .modal .codes div .copy-one:hover {
    border-color: var(--brand);
    color: var(--brand);
  }
  .modal .codes div .copy-one.copied {
    border-color: var(--ok);
    color: var(--ok);
  }
  .modal .warn-note {
    background: rgba(232,184,95,0.1);
    border-left: 3px solid var(--warn);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--warn);
    margin-bottom: 16px;
  }
  .modal .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Login */
  .login-bg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 380px;
    width: 100%;
  }
  .login-card h1 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .login-card .sub {
    color: var(--ink-muted);
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0;
    transform: translateY(-8px);
    transition: all 0.2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: var(--ok); color: var(--ok); }
  .toast.err { border-color: var(--err); color: var(--err); }

  .refresh {
    margin-left: auto;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const API = "";  // 同域调用
let adminKey = sessionStorage.getItem("df_admin_key") || "";
let currentItems = [];

function toast(msg, type = "ok") {
  const el = document.getElementById("toast");
  el.className = "toast show " + type;
  el.textContent = msg;
  setTimeout(() => el.className = "toast", 2400);
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": adminKey,
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`HTTP ${r.status}: ${t.slice(0, 200)}`);
  }
  return r.json();
}

function fmtTs(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function statusLabel(s) {
  if (s === "active") return "已激活";
  if (s === "revoked") return "已吊销";
  return s;
}

// ========== 登录页 ==========
function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="login-bg">
      <div class="login-card">
        <h1>Drama Forge<span class="badge">授权管理</span></h1>
        <p class="sub">请输入管理员密钥（X-Admin-Key）登录</p>
        <form id="loginForm">
          <label>管理员密钥</label>
          <input id="keyInput" type="password" placeholder="从服务器 .env.production 中获取 LICENSE_ADMIN_KEY" autofocus />
          <div style="margin-top: 20px;">
            <button class="primary" type="submit" style="width: 100%;">登 录</button>
          </div>
        </form>
      </div>
    </div>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const k = document.getElementById("keyInput").value.trim();
    if (!k) return;
    adminKey = k;
    sessionStorage.setItem("df_admin_key", k);
    try {
      await api("/api/admin/licenses?limit=1");
      renderApp();
    } catch (err) {
      adminKey = "";
      sessionStorage.removeItem("df_admin_key");
      toast("登录失败：" + err.message, "err");
    }
  };
}

// ========== 主面板 ==========
async function renderApp() {
  document.getElementById("app").innerHTML = `
    <div class="container">
      <header>
        <h1>Drama Forge<span class="badge">授权管理</span></h1>
        <div>
          <button class="ghost refresh" id="refreshBtn">刷新</button>
          <button class="logout" id="logoutBtn">退出登录</button>
        </div>
      </header>

      <div class="stats" id="stats"></div>

      <div class="card">
        <h2>生成新激活码</h2>
        <form id="genForm">
          <div class="form-row">
            <div>
              <label>数量（1-100）</label>
              <input id="count" type="number" value="1" min="1" max="100" />
            </div>
            <div>
              <label>有效期（天）</label>
              <input id="expires" type="number" value="365" min="1" max="3650" placeholder="留空=永久" />
            </div>
            <div>
              <label>套餐</label>
              <select id="plan">
                <option value="standard">standard（标准）</option>
                <option value="premium">premium（高级）</option>
              </select>
            </div>
            <div>
              <label>备注（客户名/批次）</label>
              <input id="note" type="text" placeholder="如：客户张三-2026Q3" />
            </div>
          </div>
          <button class="primary" type="submit" id="genBtn">生 成</button>
        </form>
      </div>

      <div class="card">
        <h2>授权列表（共 <span id="totalCount">0</span> 条）</h2>
        <div class="table-wrap">
          <table id="table">
            <thead>
              <tr>
                <th>激活码尾号</th>
                <th>状态</th>
                <th>设备</th>
                <th>激活时间</th>
                <th>最后心跳</th>
                <th>到期</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  document.getElementById("refreshBtn").onclick = loadAll;
  document.getElementById("logoutBtn").onclick = () => {
    adminKey = "";
    sessionStorage.removeItem("df_admin_key");
    renderLogin();
  };
  document.getElementById("genForm").onsubmit = doGenerate;
  await loadAll();
}

async function loadAll() {
  try {
    const data = await api("/api/admin/licenses?limit=200");
    currentItems = data.items;
    renderStats(data.items, data.total);
    renderTable(data.items);
    document.getElementById("totalCount").textContent = data.total;
  } catch (err) {
    if (err.message.includes("401")) {
      adminKey = "";
      sessionStorage.removeItem("df_admin_key");
      renderLogin();
      toast("会话已过期，请重新登录", "err");
    } else {
      toast("加载失败：" + err.message, "err");
    }
  }
}

function renderStats(items, total) {
  const active = items.filter(i => i.status === "active").length;
  const bound = items.filter(i => i.device_id).length;
  const expired = items.filter(i => {
    if (!i.expires_at) return false;
    return new Date(i.expires_at) < new Date();
  }).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="label">总授权数</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">有效</div><div class="value ok">${active}</div></div>
    <div class="stat"><div class="label">已绑定设备</div><div class="value">${bound}</div></div>
    <div class="stat"><div class="label">已过期</div><div class="value warn">${expired}</div></div>`;
}

function renderTable(items) {
  const tbody = document.getElementById("tbody");
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">暂无授权记录</td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(i => {
    const isExpired = i.expires_at && new Date(i.expires_at) < new Date();
    const status = isExpired && i.status === "active" ? "expired" : i.status;
    return `
      <tr>
        <td><span class="code">…${i.code_hint || "?????"}</span>
          <button class="ghost copy" onclick="doCopyHint('${i.id}')" title="复制尾号及备注">复制</button>
        </td>
        <td><span class="status ${status}">${statusLabel(status)}</span></td>
        <td>${i.device_name || (i.device_id ? i.device_id.slice(0,12)+"…" : "<span style='color:var(--ink-muted)'>未绑定</span>")}</td>
        <td class="ts">${fmtTs(i.activated_at)}</td>
        <td class="ts">${fmtTs(i.last_seen_at)}</td>
        <td class="ts">${fmtTs(i.expires_at)}</td>
        <td style="color:var(--ink-muted)">${i.note || "—"}</td>
        <td style="white-space:nowrap">
          ${i.device_id
            ? `<button class="ghost" onclick="doUnbind('${i.id}')" title="清除设备绑定，同一激活码可再次激活">解绑</button>`
            : ""}
          ${i.status === "active"
            ? `<button class="ghost" onclick="doRevoke('${i.id}')">吊销</button>`
            : `<button class="ghost" onclick="doRevoke('${i.id}')" style="opacity:0.5">吊销</button>`}
          <button class="ghost del" onclick="doDelete('${i.id}')">删除</button>
        </td>
      </tr>`;
  }).join("");
}

async function doGenerate(e) {
  e.preventDefault();
  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  btn.textContent = "生成中…";
  try {
    const body = {
      count: parseInt(document.getElementById("count").value) || 1,
      plan: document.getElementById("plan").value,
      note: document.getElementById("note").value.trim() || null,
    };
    const exp = parseInt(document.getElementById("expires").value);
    if (exp) body.expires_days = exp;
    const r = await api("/api/admin/licenses/generate", {
      method: "POST",
      body: JSON.stringify(body),
    });
    showCodesModal(r.licenses);
    await loadAll();
  } catch (err) {
    toast("生成失败：" + err.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "生 成";
  }
}

function showCodesModal(items) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>已生成 ${items.length} 个激活码</h3>
      <div class="warn-note">⚠️ 这些明文激活码仅显示一次，请立即复制保存。<br>关闭后无法再次查看，丢失需重新生成。</div>
      <div class="codes">${items.map((item, idx) => `<div><span class="code-text">${idx+1}. ${item.code}</span><button class="copy-one" id="copyOne${idx}" onclick="doCopyCode(${idx},'${escapeHtml(item.code)}')">复制</button></div>`).join("")}</div>
      <div class="actions">
        <button class="ghost" id="copyBtn">复制全部</button>
        <button class="primary" id="closeBtn">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#closeBtn").onclick = () => bg.remove();
  bg.querySelector("#copyBtn").onclick = () => {
    const txt = items.map(i => i.code).join("\n");
    navigator.clipboard.writeText(txt).then(() => toast("已复制到剪贴板", "ok"));
  };
  // store items for doCopyCode
  bg._codes = items;
}

async function doRevoke(id) {
  if (!confirm("确定要吊销这个授权吗？该设备的客户端将立即失效。")) return;
  try {
    await api(`/api/admin/licenses/${id}/revoke`, { method: "POST" });
    toast("已吊销", "ok");
    await loadAll();
  } catch (err) {
    toast("吊销失败：" + err.message, "err");
  }
}

async function doUnbind(id) {
  if (!confirm("解绑设备后：\n· 当前已登录的客户端会话立即失效\n· 同一枚激活码可再次激活（本机或换机）\n· 不会生成新码，也不会吊销授权\n\n确定解绑？")) return;
  try {
    const r = await api(`/api/admin/licenses/${id}/unbind`, { method: "POST" });
    toast("已解绑 …" + (r.code_hint || ""), "ok");
    await loadAll();
  } catch (err) {
    toast("解绑失败：" + err.message, "err");
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function doCopyHint(id) {
  const item = currentItems.find(i => i.id === id);
  if (!item) { toast("未找到该记录", "err"); return; }
  const txt = `尾号: ${item.code_hint}\n状态: ${statusLabel(item.status)}\n备注: ${item.note || "无"}\n设备: ${item.device_name || "未绑定"}`;
  navigator.clipboard.writeText(txt).then(() => {
    toast("已复制授权信息", "ok");
  }).catch(() => toast("复制失败", "err"));
}

function doCopyCode(idx, code) {
  navigator.clipboard.writeText(code).then(() => {
    // Update button appearance
    const btn = document.getElementById("copyOne" + idx);
    if (btn) {
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 2000);
    }
    toast("已复制: " + code, "ok");
  }).catch(() => toast("复制失败", "err"));
}

async function doDelete(id) {
  if (!confirm("确定要永久删除这条授权记录吗？\n\n此操作不可撤销！")) return;
  try {
    await api(`/api/admin/licenses/${id}`, { method: "DELETE" });
    toast("已删除", "ok");
    await loadAll();
  } catch (err) {
    toast("删除失败：" + err.message, "err");
  }
}

window.doRevoke = doRevoke;
window.doUnbind = doUnbind;
window.doDelete = doDelete;
window.doCopyHint = doCopyHint;
window.doCopyCode = doCopyCode;

// 启动
if (adminKey) {
